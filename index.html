<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Interactive Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Fredoka:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --crimson: #8B0000;
      --crimson-bright: #9E1B1B;
      --gingham-pink: #E67E8A;
      --gingham-red: #D44D5C;
      --grid-line: rgba(180, 195, 210, 0.32);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
      background-color: #f8e1e4;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Red-and-White Gingham Checkered Outer Frame */
    .gingham-frame {
      position: fixed;
      inset: 0;
      background-color: #ffffff;
      background-image:
        linear-gradient(90deg, rgba(212, 77, 92, 0.45) 50%, transparent 50%),
        linear-gradient(rgba(212, 77, 92, 0.45) 50%, transparent 50%);
      background-size: 36px 36px;
      padding: clamp(14px, 2.6vw, 28px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* White Graph-Paper Inner Card */
    .graph-canvas {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1320px;
      max-height: 820px;
      background-color: #ffffff;
      border-radius: 26px;
      box-shadow:
        0 14px 35px rgba(139, 0, 0, 0.16),
        inset 0 0 0 2px rgba(212, 77, 92, 0.18);
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 26px 26px;
      background-position: center center;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Typography Helpers */
    .font-script {
      font-family: 'Dancing Script', cursive;
    }
    .font-serif-title {
      font-family: 'Playfair Display', serif;
    }
    .font-fredoka {
      font-family: 'Fredoka', sans-serif;
    }

    /* Tactile Crimson Pill Button */
    .pill-btn {
      background: #ffffff;
      color: var(--crimson);
      border: 2.5px solid var(--crimson);
      border-radius: 9999px;
      box-shadow: 0 5px 0 var(--crimson);
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease, background-color 0.15s ease;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
    }
    .pill-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 0 var(--crimson);
      background-color: #fffafa;
    }
    .pill-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--crimson);
    }

    /* Soft Elevated YES / NO Pill Buttons */
    .choice-btn {
      background: #ffffff;
      border-radius: 9999px;
      border: 1.5px solid #f0e4e6;
      box-shadow: 0 6px 16px rgba(139, 0, 0, 0.1), 0 3px 0 rgba(139, 0, 0, 0.08);
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.16s ease;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }
    .choice-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 10px 20px rgba(139, 0, 0, 0.15), 0 4px 0 rgba(139, 0, 0, 0.1);
    }
    .choice-btn:active {
      transform: translateY(2px) scale(0.98);
    }

    /* Corner 3D Stitched Stars */
    .corner-star-tr {
      position: fixed;
      top: -12px;
      right: -12px;
      width: clamp(95px, 12vw, 155px);
      height: clamp(95px, 12vw, 155px);
      z-index: 30;
      pointer-events: none;
      filter: drop-shadow(-4px 8px 10px rgba(80, 0, 0, 0.35));
      transform: rotate(12deg);
    }

    .corner-star-bl {
      position: fixed;
      bottom: -14px;
      left: -14px;
      width: clamp(95px, 12vw, 155px);
      height: clamp(95px, 12vw, 155px);
      z-index: 30;
      pointer-events: none;
      filter: drop-shadow(4px -6px 10px rgba(80, 0, 0, 0.35));
      transform: rotate(-16deg);
    }

    /* Animations */
    @keyframes flicker {
      0%, 100% { transform: scale(1) rotate(-2deg); opacity: 1; }
      25% { transform: scale(1.08, 0.94) rotate(2deg); opacity: 0.92; }
      50% { transform: scale(0.95, 1.07) rotate(-1deg); opacity: 1; }
      75% { transform: scale(1.05, 0.96) rotate(3deg); opacity: 0.95; }
    }
    .candle-flame {
      transform-origin: 50% 90%;
      animation: flicker 0.9s infinite ease-in-out;
    }

    @keyframes smokeRise {
      0% { opacity: 0; transform: translateY(4px) scale(0.7); }
      30% { opacity: 0.75; }
      100% { opacity: 0; transform: translateY(-28px) scale(1.3) translateX(6px); }
    }
    .smoke-wisp {
      animation: smokeRise 2.2s infinite ease-out;
    }
    .smoke-wisp-delay {
      animation: smokeRise 2.2s 0.7s infinite ease-out;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    .animate-float {
      animation: floatSlow 3s ease-in-out infinite;
    }

    @keyframes giftBounce {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      25% { transform: translateY(-8px) rotate(-2.5deg) scale(1.02); }
      50% { transform: translateY(0) rotate(0deg) scale(1); }
      75% { transform: translateY(-5px) rotate(2.5deg) scale(1.01); }
    }
    .animate-gift {
      animation: giftBounce 2.6s ease-in-out infinite;
    }

    @keyframes pulseHeart {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .animate-heart-pulse {
      transform-origin: center;
      animation: pulseHeart 1.5s ease-in-out infinite;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.86) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .screen-enter {
      animation: popIn 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes angryShake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-2deg); }
      40% { transform: rotate(2deg); }
      60% { transform: rotate(-1.5deg); }
      80% { transform: rotate(1.5deg); }
    }
    .animate-angry {
      animation: angryShake 2.4s ease-in-out infinite;
    }

    @keyframes envelopeOpen {
      0% { transform: scale(1); }
      40% { transform: scale(1.06) rotate(-1.5deg); }
      100% { transform: scale(0.92) translateY(-18px); opacity: 0; }
    }
    .envelope-opening {
      animation: envelopeOpen 0.55s ease-in forwards;
    }

    /* Confetti burst animation */
    @keyframes confettiPop {
      0% { transform: scale(0.3) translate(10px, 10px); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: scale(1.05) translate(-4px, -4px); opacity: 1; }
    }
    .bunny-appear {
      animation: confettiPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
  </style>
</head>
<body>

  <!-- Outer Red & White Gingham Checkered Frame -->

          <stop offset="0%" stop-color="#A81414" />
          <stop offset="55%" stop-color="#7A0606" />
          <stop offset="100%" stop-color="#4A0000" />
        </linearGradient>
      </defs>
      <path d="M60 6L74.5 41.2L112.5 44.2L83.5 68.8L92.4 106L60 86L27.6 106L36.5 68.8L7.5 44.2L45.5 41.2L60 6Z" fill="url(#starGrad2)" stroke="#520000" stroke-width="2" stroke-linejoin="round"/>
      <path d="M60 15L72 44.2L103.5 46.7L79.5 67.1L86.8 97.8L60 81.3L33.2 97.8L40.5 67.1L16.5 46.7L48 44.2L60 15Z" stroke="#E899A2" stroke-width="1.5" stroke-dasharray="4 3" stroke-linejoin="round" opacity="0.85"/>
    </svg>

    <!-- Main White Graph-Paper Card Canvas -->
    <main class="graph-canvas" id="app-canvas">
      
      <!-- Top-Left Persistent Floating Controls -->
      <div class="absolute top-3 left-3 sm:top-5 sm:left-6 z-20 flex items-center gap-2 sm:gap-2.5">
        <!-- Sound Toggle Button -->
        <button id="sound-toggle-btn" onclick="toggleSound()" title="Toggle Sound Effects"
          class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-white border border-gray-200 shadow-md flex items-center justify-center text-[#8B0000] hover:bg-red-50 active:scale-95 transition">
          <svg id="sound-icon-on" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg id="sound-icon-off" class="w-5 h-5 hidden text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <!-- Edit Text Pill Button -->
        <button onclick="openEditModal()"
          class="h-9 sm:h-10 px-3.5 sm:px-4 rounded-full bg-white border border-gray-200 shadow-md flex items-center gap-1.5 text-xs sm:text-sm font-semibold text-gray-700 hover:text-[#8B0000] hover:border-red-200 hover:bg-red-50/40 active:scale-95 transition">
          <svg class="w-3.5 h-3.5 text-[#8B0000]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
          </svg>
          <span>Edit Text</span>

      </div>

      <!-- Top Bunting Banners (Shown on Screens 1, 4, 5, 6, 7) -->
      <div id="top-bunting" class="w-full flex justify-between items-start pointer-events-none px-2 sm:px-8 pt-0 z-10 transition-opacity duration-300">
        <!-- Left Bunting -->

          <path d="M65 37 L74 39 M67 43 L72 44" stroke="#8B0000" stroke-width="1.3"/>
          <polygon points="96,35 125,39 107,64" fill="#fff" stroke="#8B0000" stroke-width="1.6"/>

          <circle cx="195" cy="49" r="2" fill="#8B0000"/>
          <polygon points="222,38 250,33 238,59" fill="#fff" stroke="#8B0000" stroke-width="1.6"/>
          <polygon points="262,31 288,25 278,50" fill="#fff" stroke="#8B0000" stroke-width="1.6"/>
        </svg>

        <!-- Right Bunting -->
        <svg class="w-40 sm:w-64 md:w-80 h-auto -mr-2" viewBox="0 0 320 95" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 22 Q 175 68 325 8" stroke="#8B0000" stroke-width="1.8" fill="none"/>
          <polygon points="32,25 58,31 42,50" fill="#fff" stroke="#8B0000" stroke-width="1.6"/>

          <circle cx="84" cy="43" r="2" fill="#8B0000"/>

          <polygon points="153,41 182,40 169,67" fill="#fff" stroke="#8B0000" stroke-width="1.6"/>

          <polygon points="276,24 302,16 294,46" fill="#fff" stroke="#8B0000" stroke-width="1.6"/>
        </svg>
      </div>

      <!-- Dynamic Screen Container -->
      <div id="screen-container" class="flex-1 w-full flex flex-col items-center justify-center px-4 sm:px-10 pb-6 pt-2 relative z-10 overflow-y-auto">
        <!-- Screens injected via JS -->
      </div>

    </main>
  </div>

  <!-- Edit Text Customization Modal -->
  <div id="edit-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/45 backdrop-blur-xs p-4">
    <div class="bg-white rounded-3xl border-2 border-[#8B0000] shadow-2xl w-full max-w-lg overflow-hidden animate-popIn">
      <div class="bg-red-50/80 px-6 py-4 border-b border-red-100 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-xl">✏️</span>
          <h3 class="font-fredoka text-lg font-bold text-[#8B0000]">Customize Card Text</h3>
        </div>
        <button onclick="closeEditModal()" class="w-8 h-8 rounded-full bg-white text-gray-500 hover:text-[#8B0000] flex items-center justify-center shadow-xs font-bold">✕</button>
      </div>

      <div class="p-6 space-y-4 max-h-[68vh] overflow-y-auto font-quicksand">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Script Title (Screen 1)</label>
            <input id="inp-s1Script" type="text" class="w-full px-3.5 py-2 rounded-xl border border-gray-300 focus:border-[#8B0000] focus:outline-none text-sm font-semibold text-gray-800" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Main Title (Screen 1)</label>
            <input id="inp-s1Main" type="text" class="w-full px-3.5 py-2 rounded-xl border border-gray-300 focus:border-[#8B0000] focus:outline-none text-sm font-semibold text-gray-800" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Wish Prompt (Screen 1)</label>
          <input id="inp-wishLabel" type="text" class="w-full px-3.5 py-2 rounded-xl border border-gray-300 focus:border-[#8B0000] focus:outline-none text-sm font-semibold text-gray-800" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Birthday Greeting (Screen 2)</label>
            <input id="inp-s2Title" type="text" class="w-full px-3.5 py-2 rounded-xl border border-gray-300 focus:border-[#8B0000] focus:outline-none text-sm font-semibold text-gray-800" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Gift Question (Screen 2)</label>
            <input id="inp-s2Sub" type="text" class="w-full px-3.5 py-2 rounded-xl border border-gray-300 focus:border-[#8B0000] focus:outline-none text-sm font-semibold text-gray-800" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Warning Title (Screen 3)</label>
            <input id="inp-s3Title" type="text" class="w-full px-3.5 py-2 rounded-xl border border-gray-300 focus:border-[#8B0000] focus:outline-none text-sm font-semibold text-gray-800" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Envelope Prompt (Screen 4)</label>
            <input id="inp-s4Title" type="text" class="w-full px-3.5 py-2 rounded-xl border border-gray-300 focus:border-[#8B0000] focus:outline-none text-sm font-semibold text-gray-800" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Hug Card Top (Screen 5)</label>
            <input id="inp-s5Top" type="text" class="w-full px-3.5 py-2 rounded-xl border border-gray-300 focus:border-[#8B0000] focus:outline-none text-sm font-semibold text-gray-800" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Hug Card Bottom (Screen 5)</label>
            <input id="inp-s5Bottom" type="text" class="w-full px-3.5 py-2 rounded-xl border border-gray-300 focus:border-[#8B0000] focus:outline-none text-sm font-semibold text-gray-800" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Phone Hug Message (Screen 6)</label>
            <input id="inp-s6Title" type="text" class="w-full px-3.5 py-2 rounded-xl border border-gray-300 focus:border-[#8B0000] focus:outline-none text-sm font-semibold text-gray-800" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Finale Bouquet Header (Screen 7)</label>
            <input id="inp-s7Title" type="text" class="w-full px-3.5 py-2 rounded-xl border border-gray-300 focus:border-[#8B0000] focus:outline-none text-sm font-semibold text-gray-800" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Heart Note Quote (Screen 7)</label>
          <input id="inp-s7Quote" type="text" class="w-full px-3.5 py-2 rounded-xl border border-gray-300 focus:border-[#8B0000] focus:outline-none text-sm font-semibold text-gray-800" />
        </div>
      </div>

      <div class="bg-gray-50 px-6 py-4 border-t border-gray-100 flex items-center justify-between gap-3">
        <button onclick="resetCustomText()" class="px-4 py-2 rounded-full text-xs sm:text-sm font-bold text-gray-600 hover:text-[#8B0000] hover:bg-red-50 transition">
          Reset Default
        </button>
        <div class="flex items-center gap-2">
          <button onclick="closeEditModal()" class="px-4 py-2 rounded-full text-xs sm:text-sm font-bold text-gray-600 bg-white border border-gray-200 hover:bg-gray-100 transition">
            Cancel
          </button>
          <button onclick="saveCustomText()" class="pill-btn px-5 py-2 text-xs sm:text-sm">
            Save Changes
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. STATE & EDITABLE CONTENT CONFIGURATION
    // ==========================================
    const DEFAULT_TEXT = {
      s1Script: "Happy",
      s1Main: "BIRTHDAY",
      wishLabel: "Make a wish",
      blowBtn: "Blow",
      nextBtn: "next",
      s2Title: "Happy birthday Nazrana 🩷",
      s2Sub: "do you wanna open your gift",
      yesBtn: "YES",
      noBtn: "NO",
      s3Title: "how dare you???",
      tryAgainBtn: "TRY AGAIN",
      s4Title: "Tap to open",
      openSeal: "OPEN",
      s5Top: "I LOVE YOU",
      s5Bottom: "Thiiiiiiiis MUCH MUCH ❤️",
      s6Title: "Hugging you through my phone",
      s7Title: "Flowers for you Culbuli 💐",
      s7Quote: "“You’re perfect.”",
      replayBtn: "Replay"
    };

    let cardText = { ...DEFAULT_TEXT };
    let currentScreen = 1;
    let candleBlown = false;
    let soundEnabled = true;

    // ==========================================
    // 2. WEB AUDIO API CUTE SOUND SYNTHESIZER
    // ==========================================
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'click') {
          // Cute bubbly pop
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        } else if (type === 'blow') {
          // Soft wind whoosh + celebratory arpeggio chime
          const bufferSize = ctx.sampleRate * 0.35;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.sin((i / bufferSize) * Math.PI);
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(420, now);
          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0.18, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          noise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(ctx.destination);
          noise.start(now);

          // Party horn & sparkly chimes
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + 0.15 + idx * 0.07);
            g.gain.setValueAtTime(0.14, now + 0.15 + idx * 0.07);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.45 + idx * 0.07);
            osc.connect(g);
            g.connect(ctx.destination);
            osc.start(now + 0.15 + idx * 0.07);
            osc.stop(now + 0.46 + idx * 0.07);
          });
        } else if (type === 'angry') {
          // Dramatic low bonk!
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(190, now);
          osc.frequency.exponentialRampToValueAtTime(75, now + 0.28);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'magic') {
          // Sparkle chime for envelope / finale
          const freqs = [587.33, 739.99, 880, 1174.66, 1479.98];
          freqs.forEach((f, i) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now + i * 0.06);
            g.gain.setValueAtTime(0.12, now + i * 0.06);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.35);
            osc.connect(g);
            g.connect(ctx.destination);
            osc.start(now + i * 0.06);
            osc.stop(now + i * 0.06 + 0.36);
          });
        }
      } catch (e) {
        // Ignore audio context autoplay restrictions silently
      }
    }

      document.getElementById('sound-icon-on').classList.toggle('hidden', !soundEnabled);
      document.getElementById('sound-icon-off').classList.toggle('hidden', soundEnabled);

      cardText.s3Title = document.getElementById('inp-s3Title').value.trim() || DEFAULT_TEXT.s3Title;
      cardText.s4Title = document.getElementById('inp-s4Title').value.trim() || DEFAULT_TEXT.s4Title;
      cardText.s5Top = document.getElementById('inp-s5Top').value.trim() || DEFAULT_TEXT.s5Top;
      cardText.s5Bottom = document.getElementById('inp-s5Bottom').value.trim() || DEFAULT_TEXT.s5Bottom;
      cardText.s6Title = document.getElementById('inp-s6Title').value.trim() || DEFAULT_TEXT.s6Title;
      cardText.s7Title = document.getElementById('inp-s7Title').value.trim() || DEFAULT_TEXT.s7Title;
      cardText.s7Quote = document.getElementById('inp-s7Quote').value.trim() || DEFAULT_TEXT.s7Quote;

      closeEditModal();
      renderScreen(false);
    }

    function resetCustomText() {
      playSound('click');
      cardText = { ...DEFAULT_TEXT };
      openEditModal();
      renderScreen(false);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Initialize Screen 1 on Load
    window.addEventListener('DOMContentLoaded', () => {
      goToScreen(1);
    });
  </script>
</body>
</html>
